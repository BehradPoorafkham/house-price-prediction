[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "house-price-prediction"
version = "0.1.0"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "http.client",
    "mysql",
    "joblib"
]


[tool.setuptools.packages.find]
where = ["."]